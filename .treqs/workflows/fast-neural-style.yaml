name: fast-neural-style reproduction

# Generated by scaffold_row.py. Clean-DAG rules baked in: every step is a NAMED
# `roar run -n <name>` (trace:off, same-ABI); outputs live in git-tracked dirs
# (.gitkeep) with files gitignored; publish --no-tag.
#
# ── THIS IS A MONOREPO. EVERY PATH IS SCOPED TO fast_neural_style/. ───────────
# pytorch/examples holds ~25 unrelated examples in one tree. This row reproduces
# exactly one of them. Every command, every input path and every output directory
# below is under `fast_neural_style/`, and nothing in this workflow reads, writes
# or installs anything belonging to a sibling directory. That is not tidiness: a
# sibling here is actively hazardous. `imagenet/main.py:432` does
# `shutil.copyfile(filename, 'model_best.pth.tar')`, which reproduces a checkpoint's
# bytes exactly at a second path -- the duplicate-bytes shape this campaign screens
# every row for. `fast_neural_style/` contains no copy, link or symlink of any kind
# (verified: no `os.link`, `os.symlink`, `shutil.copyfile`, `shutil.copy2`,
# `shutil.copy` anywhere under it), and it must stay that way.
#
# ── THERE IS NO EXPERIMENT-LOGGING STAGE, AND THAT IS DELIBERATE. ─────────────
# The generated scaffold puts `--wandb-to-trackio` and a `TRACKIO_SPACE_ID` export
# on every run stage. Both have been REMOVED here. `fast_neural_style/` ships no
# experiment-logging integration whatsoever -- grepped for wandb, mlflow, trackio,
# tensorboard, SummaryWriter, comet, neptune and report_to: zero hits in the whole
# subdirectory. `--wandb-to-trackio` only intercepts a `wandb` import that a
# workload actually performs, so against this workload it is a guaranteed no-op.
# Leaving it in would put a bridge in the record that the record never uses, and
# would imply a logging path that does not exist. The honest form is to leave it
# out and say so: this row's `experimentUrl` is null, with the reason recorded.
# Adding logging code to neural_style.py to manufacture a link would forfeit the
# zero-upstream-lines property that makes the row worth anything.
#
# ── WHY THE PUBLISHED ARTIFACT IS A "CHECKPOINT" AND NOT THE "FINAL" MODEL. ───
# neural_style.py:119-122 names its final model with a WALL-CLOCK TIMESTAMP:
#     f"epoch_{args.epochs}_{time.strftime('%Y-%m-%d_%H-%M-%S')}_{cw}_{sw}.model"
# so the path upstream writes is unknowable until after the run, and no later stage
# can name it without globbing. A recorded pipeline cannot glob: `roar label set`
# and `roar put` take literal paths, and the traced commands are argv, not shell.
# The checkpoint path, by contrast, is fully determined by the recipe --
# `ckpt_epoch_{epoch}_batch_id_{n}.pth` (line 112) -- so this workflow sets
# --checkpoint-interval to exactly the number of batches in the epoch (2368 =
# ceil(9469/4)). The single checkpoint that produces is written after the final
# optimizer step of the final batch, i.e. it holds the SAME WEIGHTS as the
# timestamped final model; it is not an early snapshot. Both files are written and
# both are in the lineage; only the deterministically-named one is labelled and
# published.
#   The fetch step asserts the 9,469-image count (--expect-train-images) and exits
# non-zero if it differs, precisely because --checkpoint-interval is derived from
# it -- a changed dataset would otherwise train for ~7 GPU-minutes and then write a
# file no later stage knows the name of.
#   Measured, not assumed, that these two files are not byte-duplicates: on an
# 8-image probe run the checkpoint was 6,739,497 bytes / sha256 e43d7632... and the
# final model 6,741,397 bytes / sha256 2e993b14..., because torch.save embeds the
# output file's stem in the zip container. Same weights, different bytes.

secrets:
  - HF_TOKEN            # roar put upload (the dataset is fetched anonymously)
# The provenance CLI is NOT fetched from a presigned URL held in a per-target
# secret. It is a PUBLISHED build, installed by name+version from a public index
# and verified by wheel sha256. That removes a shared mutable secret from the run:
# two operators on this compute target can no longer overwrite each other's tooling.

setup:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    python -c "import sys; print('python', sys.version)"
    python -m pip install --quiet requests || true
    # Belt and braces against P0-12: a stray *.egg-info makes importlib.metadata
    # report a self-install that pip already removed. Nothing in this row installs
    # itself -- fast_neural_style is plain scripts, not a package -- so this should
    # find nothing. Harmless when it does not.
    rm -rf *.egg-info fast_neural_style/*.egg-info
    sudo rm -rf /usr/local/lib/python3.10/dist-packages/roar_cli-*.dist-info \
                /usr/local/lib/python3.10/dist-packages/roar \
                /opt/pytorch/lib/python3.12/site-packages/roar_cli-*.dist-info \
                /opt/pytorch/lib/python3.12/site-packages/roar \
                /usr/local/bin/roar /usr/local/bin/roar-worker \
                /opt/pytorch/bin/roar /opt/pytorch/bin/roar-worker \
                /usr/local/lib/python3.10/dist-packages/roar_inject.pth \
                /opt/pytorch/lib/python3.12/site-packages/roar_inject.pth
    # `uv` is not on PATH on every campaign AMI (this stage runs as root and
    # /root/.local/bin is not always inherited), so make it explicit and bootstrap
    # it if the image lacks it. This stage is `trace: off`; nothing here reaches
    # the lineage.
    export PATH=$PATH:/root/.local/bin:/usr/local/bin
    command -v uv >/dev/null || { curl -LsSf https://astral.sh/uv/install.sh | env UV_INSTALL_DIR=/usr/local/bin sh; }
    command -v uv
    # Install the CLI under the SAME interpreter the workload records, read off the
    # workload's own python rather than hard-coded: a different interpreter lets
    # host dist-packages shadow the recorded pins inside the traced child, so a run
    # can pass against packages that are not the ones written down.
    RECORDED_PY="$(python -c 'import sys; print("%d.%d.%d" % sys.version_info[:3])')"
    echo "recorded interpreter: $RECORDED_PY"
    # `--index-strategy unsafe-best-match` is REQUIRED, not cosmetic: uv gives an
    # --extra-index-url first-match priority over the --index-url, so with the
    # default strategy it finds roar-cli on the main index, never sees this
    # version, and dies "no version of roar-cli==0.4.4rc5".
    uv tool install --python "$RECORDED_PY" --force --with huggingface-hub \
        --index-strategy unsafe-best-match \
        --index-url https://test.pypi.org/simple/ \
        --extra-index-url https://pypi.org/simple/ \
        roar-cli==0.4.4rc5
    sudo ln -sf "$(uv tool dir --bin 2>/dev/null || echo /root/.local/bin)/roar" /usr/local/bin/roar
    test "$(roar --version | grep -o '[0-9][^ ]*$')" = "0.4.4rc5" || \
      { echo "WRONG ROAR: $(roar --version)"; exit 1; }
    # A version string is not an identity -- distinct builds have shipped under one
    # version string on this project before. Pin the artefact by wheel sha256 and
    # prove the installed files came from that wheel.
    ROAR_WHEEL_SCRATCH=/var/tmp python fast_neural_style/repro/verify_roar_wheel.py \
      --version 0.4.4rc5 \
      --sha256 ed35ed6bda3b5698ab65a887e7390c2ac073123f6d94bfa27b8282285352219c \
      --exe "$(command -v roar)"
    test "$(ls $(dirname $(readlink -f $(command -v roar)))/../lib/python*/site-packages/roar/bin | wc -l)" -ge 6 || \
      { echo "NO TRACER BINARIES"; exit 1; }
    roar --version
    roar tracer use preload
    roar tracer
    # --- the workload's own environment ------------------------------------
    # fast_neural_style declares exactly three dependencies (numpy, torch>=2.6,
    # torchvision) and is plain scripts -- no package, no `pip install -e .`, so
    # none of the editable-install tracer blindness applies here. Show what the
    # image already provides rather than installing over it.
    python -m pip list 2>/dev/null | grep -Ei '^(torch|torchvision|numpy|pillow) ' || true
    # requirements.txt OMITS Pillow, but neural_style/utils.py:2 does `from PIL
    # import Image` for every image it loads and saves. It works only because
    # torchvision pulls Pillow in transitively. Assert it explicitly here so a
    # missing Pillow fails in setup rather than mid-training.
    python -c "import PIL; print('pillow', PIL.__version__)"
    # torch.accelerator (used by neural_style.py:33 under --accel) landed in 2.6;
    # requirements.txt says torch>=2.6 for exactly this reason. Fail here if the
    # image predates it rather than after the dataset download.
    python -c "import torch; assert hasattr(torch, 'accelerator'), 'torch.accelerator missing: --accel needs torch>=2.6'; print('torch', torch.__version__, '| accelerator available:', torch.accelerator.is_available())"
    python -c "import torch; print('cuda', torch.cuda.is_available(), '|', torch.cuda.get_device_name(0) if torch.cuda.is_available() else 'cpu')"
    # Gate the environment BEFORE any paid step: a `+cuNNN` local version or a
    # PEP-503 duplicate makes the recorded freeze un-installable from PyPI, so the
    # lineage could never be rebuilt. Fail here rather than at verification.
    python fast_neural_style/repro/freeze_audit.py
    # HF_TOKEN is needed by the publish stage only (there is no metrics upload on
    # this row). Prove it reached the task env before paying for training, rather
    # than discovering it at `roar put` after every traced step has succeeded.
    # Value never printed -- length only.
    python -c "import os,sys; t=os.environ.get('HF_TOKEN') or ''; print('HF_TOKEN present in task env:', bool(t), '| length:', len(t)); sys.exit(0 if t else 1)"
    # --- COST-MODEL MEASUREMENT, not part of the pipeline ------------------
    # Vgg16.__init__ (neural_style/vgg.py:10) constructs
    # models.vgg16(weights=VGG16_Weights.IMAGENET1K_V1), so the first thing the
    # training step does on a cold host is download a ~528 MB ImageNet checkpoint
    # from download.pytorch.org. That is a FIXED cost: it is paid once regardless
    # of how many epochs are run, and scaling a total wall-clock that contains it
    # is exactly how a full-run estimate ends up wrong by an order of magnitude.
    # Time it here into a THROWAWAY TORCH_HOME so the real cache stays cold and the
    # train step still pays what a fresh machine pays -- this measures the size of
    # the component, it does not remove it. Never fatal.
    rm -rf /var/tmp/torchhome-probe
    TORCH_HOME=/var/tmp/torchhome-probe python -c "import time, torchvision, os; t0=time.time(); torchvision.models.vgg16(weights='VGG16_Weights.IMAGENET1K_V1'); dt=time.time()-t0; tot=sum(os.path.getsize(os.path.join(d,f)) for d,_,fs in os.walk('/var/tmp/torchhome-probe') for f in fs); print('VGG16_IMAGENET_WEIGHTS_DOWNLOAD_SECONDS %.2f BYTES %d' % (dt, tot))" || true
    rm -rf /var/tmp/torchhome-probe
    git status --porcelain
    roar init || true
  trace: off

fetch_dataset:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    date +'FETCH_START %s %FT%TZ'
    roar run -n fetch_dataset -- python fast_neural_style/repro/fetch_dataset.py --url https://s3.amazonaws.com/fast-ai-imageclas/imagenette2-320.tgz --out-dir fast_neural_style/out-data --expect-train-images 9469
    date +'FETCH_END %s %FT%TZ'
  trace: off

train:
  command: |
    # No --num_workers knob exists to get wrong here: neural_style.py:49 builds
    # `DataLoader(train_dataset, batch_size=args.batch_size)` with no workers
    # argument at all, so loading is single-process by construction. That is the
    # configuration that keeps a traced step recording the WORKLOAD's package set
    # instead of only the tracer's own closure -- this row gets it for free.
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    date +'TRAIN_START %s %FT%TZ'
    roar run -n train -- python fast_neural_style/neural_style/neural_style.py train --dataset fast_neural_style/out-data/imagenette2-320/train --style-image fast_neural_style/images/style-images/mosaic.jpg --save-model-dir fast_neural_style/out-models --checkpoint-model-dir fast_neural_style/out-ckpt --checkpoint-interval 2368 --epochs 1 --batch-size 4 --image-size 256 --seed 42 --log-interval 200 --accel
    date +'TRAIN_END %s %FT%TZ'
    ls -la fast_neural_style/out-ckpt fast_neural_style/out-models
    sha256sum fast_neural_style/out-ckpt/*.pth fast_neural_style/out-models/*.model
  trace: off

stylize:
  command: |
    # Upstream's own `eval` subcommand, unmodified: this is the evaluation path the
    # README documents, and it is the only one this example ships. Note what it is
    # NOT -- fast_neural_style computes no held-out metric, so the quantitative
    # output of this row is the training loss (content / style / total, printed
    # every 200 batches by neural_style.py:101-108) and the qualitative output is
    # this stylised image.
    #   --content-scale and --style-size are deliberately NOT passed. Both route
    # into utils.load_image, which calls Image.ANTIALIAS (neural_style/utils.py:8,
    # 10) -- removed in Pillow 10.0. On any current Pillow those two flags raise
    # AttributeError. Left unset, load_image skips the resize branch entirely and
    # the example runs clean.
    export PATH=/opt/pytorch/bin:$PATH
    export PYTHONUNBUFFERED=1
    date +'STYLIZE_START %s %FT%TZ'
    roar run -n stylize -- python fast_neural_style/neural_style/neural_style.py eval --content-image fast_neural_style/images/content-images/amber.jpg --model fast_neural_style/out-ckpt/ckpt_epoch_0_batch_id_2368.pth --output-image fast_neural_style/out-stylized/amber-mosaic.jpg --accel
    date +'STYLIZE_END %s %FT%TZ'
    ls -la fast_neural_style/out-stylized
    sha256sum fast_neural_style/out-stylized/amber-mosaic.jpg
  trace: off

label:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar label set artifact fast_neural_style/out-ckpt/ckpt_epoch_0_batch_id_2368.pth model.name=fast-neural-style model.version=1 license.id=BSD-3-Clause license.name='BSD 3-Clause License' description='fast-neural-style TransformerNet (Johnson et al. perceptual losses + instance normalisation) trained against the mosaic style image with a VGG-16 perceptual loss. TRUNCATED pipeline-viability run: 1 of upstream'"'"'s default 2 epochs, over Imagenette-320 (9,469 images) instead of the README'"'"'s COCO-2014-train (82,783). NOT converged.' documentation.url=https://github.com/pytorch/examples/blob/main/fast_neural_style/README.md
  trace: off

publish:
  command: |
    export PATH=/opt/pytorch/bin:$PATH
    roar put fast_neural_style/out-ckpt/ckpt_epoch_0_batch_id_2368.pth hf://reproducible-ai/fast-neural-style --public --yes --no-tag -m "fast-neural-style TransformerNet trained on Imagenette-320 (9,469 images) against the mosaic style image: 1 of upstream's default 2 epochs, batch size 4, image size 256. TRUNCATED pipeline-viability run, NOT converged and not a quality result."
  trace: off
